<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gut Health Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-pfj4qf-n.js?v=questions5"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CEvjHUZg.css">
    <style>
      html, body, #root {
        height: 100%;
        overflow: hidden;
      }
      .shell {
        height: 100vh;
        min-height: 100vh;
        overflow: hidden;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        max-height: 100vh;
        overflow: auto;
        align-self: start;
      }
      .canvas {
        height: 100vh;
        max-height: 100vh;
        overflow: auto;
      }
      * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      .row-actions { display: flex; gap: .35rem; justify-content: flex-end; }
      .icon-btn, a.icon-btn {
        width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
        border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--forest);
        cursor: pointer; padding: 0; text-decoration: none;
      }
      .icon-btn.danger, a.icon-btn.danger { color: var(--terra); }
      .icon-btn svg { display: block; }
      iframe.survey-frame {
        width: 100%;
        height: 640px;
        border: 0;
        background: transparent;
        display: block;
        overflow: hidden;
      }
    </style>
    <script>
      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "survey-height") return;
        const frame = document.querySelector("iframe.survey-frame");
        if (!frame) return;
        frame.style.height = Math.max(480, Number(event.data.height) || 640) + "px";
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
